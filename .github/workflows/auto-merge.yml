name: Auto-merge

# Squash-merge an open PR labeled `auto-merge` — but ONLY when the delegated
# merge contract in CLAUDE.md/AGENTS.md is satisfied at the PR's current head.
#
# WHY THE GATES EXIST (2026-08-09). This workflow used to merge on CI success
# alone and then dispatch a production deploy. PR #361 is the witness: merged
# ~12s after CI turned green, with no independent exact-head review, and
# deployed immediately. "CI is green" is not "a delegated reviewer approved
# THIS commit", and merging is not deploying.
#
# WAKE PATHS (2026-08-10). Review, labelling and checks finish in any order, so
# every one of them must be able to wake evaluation — otherwise a review that
# lands last strands the PR forever:
#   - status         → a codex/exact-head-review result arrived
#   - workflow_run   → CI *or* Preview finished
#   - pull_request   → the auto-merge / deploy-approved label was applied
# Each path re-runs the same gates, so ordering cannot change the outcome.
#
# SELF-DEADLOCK (2026-08-11, live witness run 31486935846). Requiring exactly
# CLEAN stranded PR #363: a pull_request-triggered run is itself a check on the
# PR head, so the head reads UNSTABLE while the job evaluates and the job
# refuses itself — forever, since each retry recreates the pending check. The
# script now admits UNSTABLE only when it PROVES itself the cause (label path,
# all commit statuses successful, exactly one non-green check, owned by this
# run's id, still in flight). Everything else still refuses.
#
# The decision logic lives in .github/scripts/auto-merge.sh so it can be
# executed and asserted outside Actions; .github/contract-tests/ runs it against
# a stubbed `gh` and fails if any gate regresses.
#
# Why not native GitHub auto-merge: private repos on the free tier can't require
# status checks via branch protection, so `gh pr merge --auto` would merge
# instantly on PR open rather than waiting.

on:
  workflow_run:
    workflows: ["CI", "Preview"]
    types: [completed]
  pull_request:
    types: [labeled]
  status:

jobs:
  merge:
    runs-on: ubuntu-latest
    # Admit all three orderings. The script re-checks every gate regardless of
    # which event woke it, so a permissive condition cannot weaken the contract.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request' &&
       (github.event.label.name == 'auto-merge' ||
        github.event.label.name == 'deploy-approved')) ||
      (github.event_name == 'status' &&
       github.event.state == 'success' &&
       github.event.context == 'codex/exact-head-review')
    # An explicit block sets every UNLISTED scope to none, so this must cover
    # every API the script touches or the token 403s before any gate runs.
    permissions:
      actions: write         # dispatch Deploy (deploy-approved only); read subsumed
                             # for GET /actions/runs/{run_id}/jobs (gate 4d)
      checks: read           # gate 2: GET /commits/{sha}/check-runs
      contents: write        # squash-merge
      pull-requests: write   # merge, and read PR/label/mergeability state
      statuses: read         # gate 1: GET /commits/{sha}/status
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the merge contract, then squash-merge at the pinned head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS_SHA: ${{ github.event.sha }}
          STATUS_CONTEXT: ${{ github.event.context }}
          STATUS_STATE: ${{ github.event.state }}
        run: bash .github/scripts/auto-merge.sh
